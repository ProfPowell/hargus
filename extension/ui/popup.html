<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HARgus</title>
  <link rel="stylesheet" href="theme.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup">
  <header class="appbar">
    <span class="brand"><svg class="mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#101826"/><path d="M4 16c3.5-5.6 7.6-8.4 12-8.4s8.5 2.8 12 8.4c-3.5 5.6-7.6 8.4-12 8.4S7.5 21.6 4 16z" fill="none" stroke="#F5F6F4" stroke-width="2.6" stroke-linejoin="round"/><rect x="10" y="11.6" width="6" height="2.6" rx="1.3" fill="#3AD3C1"/><rect x="12.5" y="14.7" width="8" height="2.6" rx="1.3" fill="#3AD3C1"/><rect x="16" y="17.8" width="6" height="2.6" rx="1.3" fill="#3AD3C1"/></svg> <span class="wordmark"><b>HAR</b>gus</span></span>
    <div class="actions"><a class="btn ghost" href="library.html" target="_blank">Readings</a></div>
  </header>
  <main>
    <div class="target">
      <strong id="title">…</strong>
      <span id="url"></span>
    </div>

    <button id="take" class="btn primary take" type="button">Take reading</button>
    <div class="row">
      <button id="record" class="btn" type="button">● Record</button>
      <button id="snapshot" class="btn" type="button" title="Read the page as it is now, without reloading">Snapshot</button>
    </div>

    <output id="status" aria-live="polite"></output>

    <details id="capture-opts" class="disclosure">
      <summary>Capture options</summary>
      <div class="opts disclosure-body">
        <label class="pair">Device
          <select name="device"><option value="desktop">Desktop</option><option value="mobile">Mobile (iPhone)</option><option value="tablet">Tablet (iPad)</option></select>
        </label>
        <label class="pair">Network
          <select name="throttle"><option value="none">No throttling</option><option value="slow-4g">Slow 4G + 4× CPU</option><option value="3g">3G + 4× CPU</option></select>
        </label>
        <label class="pair">Response bodies
          <select name="bodies"><option value="none">None</option><option value="document">Document only</option><option value="text">Text resources</option><option value="all">Everything</option></select>
        </label>
        <label><input type="checkbox" name="fullPage"> Full-page screenshot</label>
        <label><input type="checkbox" name="scroll"> Scroll to load lazy content</label>
        <label><input type="checkbox" name="focusCheck"> Focus-style check</label>
        <label><input type="checkbox" name="bypassCache"> Bypass cache</label>
        <fieldset class="views-opts">
          <legend>Views</legend>
          <label><input type="checkbox" name="views.desktop"> Desktop</label>
          <label><input type="checkbox" name="views.tablet"> Tablet</label>
          <label><input type="checkbox" name="views.mobile"> Phone</label>
          <label><input type="checkbox" name="views.nojs"> No JavaScript</label>
          <label><input type="checkbox" name="views.nocss"> No CSS</label>
          <label><input type="checkbox" name="views.noimages"> No images</label>
          <label><input type="checkbox" name="views.rtl"> Right-to-left</label>
          <label><input type="checkbox" name="views.translated-de"> German</label>
          <label><input type="checkbox" name="views.translated-ar"> Arabic</label>
          <label><input type="checkbox" name="views.translated-ja"> Japanese</label>
          <label title="Runs only when a translated view could not"><input type="checkbox" name="views.pseudo"> Long text (fallback)</label>
          <label><input type="checkbox" name="views.vision"> Vision simulations</label>
          <label><input type="checkbox" name="views.dark"> Dark mode</label>
          <label><input type="checkbox" name="views.forced"> Forced colours</label>
          <label><input type="checkbox" name="views.morecontrast"> More contrast</label>
          <label><input type="checkbox" name="views.print"> Print</label>
          <label><input type="checkbox" name="views.spacing"> Text spacing</label>
          <label><input type="checkbox" name="views.reflow"> 320 px reflow</label>
          <label><input type="checkbox" name="views.text200"> 200% text</label>
          <label><input type="checkbox" name="views.breakpoints"> Breakpoint edges</label>
        </fieldset>
      </div>
    </details>

    <details id="plugin-opts" class="disclosure">
      <summary>Plugins <span id="plugin-count"></span></summary>
      <div class="disclosure-body"><div id="plugins"></div></div>
    </details>
  </main>
  <footer>
    <a href="options.html" target="_blank">Options</a>
    <span class="muted">Shortcut <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd></span>
  </footer>
</body>
</html>
