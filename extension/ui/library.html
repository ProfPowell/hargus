<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Readings — HARgus</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="theme.css">
  <script type="module" src="library.js"></script>
</head>
<body class="library">
  <header class="appbar">
    <a class="brand" href="library.html"><svg class="mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#101826"/><path d="M4 16c3.5-5.6 7.6-8.4 12-8.4s8.5 2.8 12 8.4c-3.5 5.6-7.6 8.4-12 8.4S7.5 21.6 4 16z" fill="none" stroke="#F5F6F4" stroke-width="2.6" stroke-linejoin="round"/><rect x="10" y="11.6" width="6" height="2.6" rx="1.3" fill="#3AD3C1"/><rect x="12.5" y="14.7" width="8" height="2.6" rx="1.3" fill="#3AD3C1"/><rect x="16" y="17.8" width="6" height="2.6" rx="1.3" fill="#3AD3C1"/></svg> <span class="wordmark"><b>HAR</b>gus</span> <span class="muted">Readings</span></a>
    <div class="actions">
      <a class="btn ghost" href="options.html">Options</a>
    </div>
  </header>
  <main>
    <div class="lib-tabs" role="tablist" aria-label="Library">
      <button type="button" role="tab" id="tab-readings" aria-selected="true" aria-controls="pane-readings" data-tab="readings">Readings</button>
      <button type="button" role="tab" id="tab-sets" aria-selected="false" aria-controls="pane-sets" data-tab="sets" tabindex="-1">Sets</button>
    </div>
    <div id="pane-readings" role="tabpanel" aria-labelledby="tab-readings">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Filter by title, host, tag or note…" aria-label="Filter readings">
      <select id="sort" aria-label="Sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="host">Host</option>
        <option value="issues">Most high/medium findings</option>
      </select>
      <label class="btn" for="import">Import HAR…</label>
      <input type="file" id="import" accept=".har,.json,application/json" multiple hidden>
      <label class="chip"><input type="checkbox" id="import-lookups"> run lookups on import</label>
    </div>
    <p id="count" class="muted"></p>
    <div id="selbar" class="selbar" hidden>
      <strong id="selcount" aria-live="polite"></strong>
      <button class="btn" type="button" id="sel-compare">Compare</button>
      <button class="btn" type="button" id="sel-save">Save as set</button>
      <form id="sel-name" class="inline-form" hidden>
        <input type="text" id="sel-name-in" placeholder="Set name" aria-label="Set name" required maxlength="80">
        <button class="btn" type="submit">Save</button>
        <button class="btn ghost" type="button" id="sel-name-cancel">Cancel</button>
      </form>
      <button class="btn ghost" type="button" id="sel-clear">Clear</button>
    </div>
    <div id="list" class="grid"></div>
    </div>
    <div id="pane-sets" role="tabpanel" aria-labelledby="tab-sets" hidden>
      <div class="toolbar"><button class="btn" type="button" id="new-set-open">New set</button></div>
      <form id="new-set" class="set-form" hidden>
        <label>Name <input type="text" id="ns-name" required maxlength="80"></label>
        <label>Sites, one URL per line <textarea id="ns-urls" rows="6" placeholder="example.com&#10;https://example.org/"></textarea></label>
        <p id="ns-bad" class="muted" role="status"></p>
        <div class="set-opts">
          <label>Device <select id="ns-device"><option value="desktop">Desktop</option><option value="mobile">Mobile (iPhone)</option><option value="tablet">Tablet (iPad)</option></select></label>
          <label>Throttle <select id="ns-throttle"><option value="none">No throttling</option><option value="slow-4g">Slow 4G + 4× CPU</option><option value="3g">3G + 4× CPU</option></select></label>
          <label>Runs <select id="ns-runs"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select></label>
          <label class="chip"><input type="checkbox" id="ns-cache"> Bypass cache</label>
          <label class="chip"><input type="checkbox" id="ns-coverage"> Code coverage</label>
        </div>
        <div class="actions">
          <button class="btn" type="submit" data-after="save">Save</button>
          <button class="btn" type="submit" data-after="record">Save and record</button>
          <button class="btn ghost" type="button" id="ns-cancel">Cancel</button>
        </div>
      </form>
      <div id="set-list" class="grid"></div>
    </div>
    <div id="add-menu" class="add-menu" role="menu" hidden></div>
  </main>
</body>
</html>
