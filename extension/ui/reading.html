<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading — HARgus</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="theme.css">
  <style>
    #export-menu { inset: auto; top: 3.4rem; right: 1rem; margin: 0; }
  </style>
  <script type="module" src="reading.js"></script>
</head>
<body class="reading">
  <header class="appbar">
    <a class="brand" href="library.html"><svg class="mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#101826"/><path d="M4 16c3.5-5.6 7.6-8.4 12-8.4s8.5 2.8 12 8.4c-3.5 5.6-7.6 8.4-12 8.4S7.5 21.6 4 16z" fill="none" stroke="#F5F6F4" stroke-width="2.6" stroke-linejoin="round"/><rect x="10" y="11.6" width="6" height="2.6" rx="1.3" fill="#3AD3C1"/><rect x="12.5" y="14.7" width="8" height="2.6" rx="1.3" fill="#3AD3C1"/><rect x="16" y="17.8" width="6" height="2.6" rx="1.3" fill="#3AD3C1"/></svg> <span class="wordmark"><b>HAR</b>gus</span></a>
    <span class="appbar-title" id="appbar-title"></span>
    <div class="actions">
      <button class="btn" id="rerun" type="button" title="Re-run offline analysis and lookups with current plugins and settings">Re-run analysis</button>
      <button type="button" class="btn help-btn" popovertarget="help" aria-label="Help"><span aria-hidden="true">?</span> Help</button>
      <button class="btn" type="button" popovertarget="export-menu">Export ▾</button>
      <div id="export-menu" popover class="menu">
        <button type="button" data-export="print">Print or save as PDF</button>
        <button type="button" data-export="report">Standalone HTML report (.html)</button>
        <button type="button" data-export="full">HAR-PLUS file (everything)</button>
        <button type="button" data-export="lite">HAR-PLUS file (no bodies, thumbnail only)</button>
        <button type="button" data-export="markdown">Markdown brief (.md)</button>
        <button type="button" data-export="copy">Copy brief to clipboard</button>
      </div>
      <button class="btn danger" id="delete" type="button">Delete</button>
    </div>
  </header>
  <p class="sr-only" aria-live="polite" id="prog-live"></p>
  <main id="app"><p class="muted">Loading reading…</p></main>
  <dialog id="dlg" aria-labelledby="dlg-title">
    <header><h3 id="dlg-title"></h3><button class="btn" id="dlg-close" type="button">Close</button></header>
    <div class="body" id="dlg-body"></div>
  </dialog>
</body>
</html>
