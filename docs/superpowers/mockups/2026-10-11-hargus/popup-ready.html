<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARgus popup — ready</title>
<!-- Static mockup for the HARgus redesign. Inline styles are the design reference; the extension
     implements them with theme.css tokens (see docs/brand/tokens.css), not inline styles. -->
<style>
@font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("../../../brand/fonts/instrument-sans-latin-wght.woff2") format("woff2-variations"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../../../brand/fonts/ibm-plex-mono-latin-400.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../../../brand/fonts/ibm-plex-mono-latin-500.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("../../../brand/fonts/ibm-plex-mono-latin-600.woff2") format("woff2"); }
body { margin: 0; background: #e9ebe9; }
a { color: #0A7C71; } a:hover { color: #065E56; }
button:focus-visible, a:focus-visible { outline: 2px solid #0A7C71; outline-offset: 2px; }
</style>
</head>
<body>
<div style="padding: 24px; display: inline-block;">
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #F5F6F4; color: #101826; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; background: #FFFFFF; border-bottom: 1px solid #D9DCE0;">
    <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#101826"></rect><path d="M4 16c3.5-5.6 7.6-8.4 12-8.4s8.5 2.8 12 8.4c-3.5 5.6-7.6 8.4-12 8.4S7.5 21.6 4 16z" fill="none" stroke="#F5F6F4" stroke-width="2.6" stroke-linejoin="round"></path><rect x="10" y="11.6" width="6" height="2.6" rx="1.3" fill="#3AD3C1"></rect><rect x="12.5" y="14.7" width="8" height="2.6" rx="1.3" fill="#3AD3C1"></rect><rect x="16" y="17.8" width="6" height="2.6" rx="1.3" fill="#3AD3C1"></rect></svg>
    <span style="font-weight: 700; font-size: 18px; letter-spacing: -0.01em;"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: -0.04em;">HAR</span>gus</span>
    <span style="flex-grow: 1;"></span>
    <button type="button" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; background: transparent; color: #101826; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="5" rx="1.5"></rect><rect x="4" y="11" width="16" height="9" rx="1.5"></rect><path d="M8 15h8"></path></svg>
      Readings
    </button>
    <button type="button" aria-label="Options" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #586170; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: #182B49; color: #FFCD00; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;">UC</div>
      <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">University of California San Diego</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #586170;">www.ucsd.edu</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #FFFFFF; border: 1px solid #D9DCE0; border-radius: 12px;">
      <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: #FFF0C7; color: #6E4700; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;">
        <span style="font-size: 18px; font-weight: 700;">C</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 2px;">76</span>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; font-weight: 600;">Last reading: yesterday</span>
        <span style="font-size: 12px; color: #586170;">65 findings · scored as General</span>
      </div>
      <a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 4px;">Open</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span id="mode-label" style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #586170;">Reading type</span>
      <div role="group" aria-labelledby="mode-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; background: #E6E8E6; border-radius: 12px;">
        <button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 9px; font: inherit; font-size: 14px; cursor: pointer; background: #FFFFFF; color: #101826; font-weight: 600; box-shadow: 0 1px 2px rgba(16,24,38,0.14);">Reload</button>
          <button type="button" aria-pressed="false" style="height: 40px; border: 0; border-radius: 9px; font: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #4A4E55; font-weight: 500;">As it is</button>
          <button type="button" aria-pressed="false" style="height: 40px; border: 0; border-radius: 9px; font: inherit; font-size: 14px; cursor: pointer; background: transparent; color: #4A4E55; font-weight: 500;">Journey</button>
      </div>
      <p style="margin: 0; min-height: 36px; font-size: 13px; line-height: 1.4; color: #3B4250;">Reloads the page and records everything from the first request. The most complete reading.</p>
    </div>

    <button type="button" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 12px; background: #101826; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;">
      
      Take a reading
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 400; color: #B9BCC2;">≈ 25 s</span>
    </button>

    <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 44px; text-align: left; background: #FFFFFF; border: 1px solid #D9DCE0; border-radius: 12px; color: #101826; font: inherit; cursor: pointer;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 14px; font-weight: 600;">Setup: Check-up</span>
        <span style="font-size: 12px; color: #586170;">Desktop · 4 views · 32 checks · General</span>
        <span style="font-size: 12px; color: #586170;">14 checks contact outside services ↗</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#586170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>

  </main>

  <footer style="padding: 10px 16px; border-top: 1px solid #D9DCE0; font-size: 12px; color: #586170;">
    <kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 1px 5px; border: 1px solid #C9CBC4; border-radius: 4px; background: #FFFFFF;">Alt</kbd>+<kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 1px 5px; border: 1px solid #C9CBC4; border-radius: 4px; background: #FFFFFF;">Shift</kbd>+<kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 1px 5px; border: 1px solid #C9CBC4; border-radius: 4px; background: #FFFFFF;">H</kbd> takes a reading of any tab
  </footer>

</div>
<!-- Reading types (the segmented control drives the button label and the help line):
     Reload   → "Take a reading"  · ≈ 25 s · "Reloads the page and records everything from the first request. The most complete reading."
     As it is → "Read as it is"   · ≈ 8 s  · "No reload. Keeps form input and sign-in state. Network detail is rebuilt, so it is approximate."
     Journey  → "Start recording" (red dot before the label, no time) · "Records every page you visit until you press Stop. For sign-ups, checkouts and other flows." -->
</div>
</body>
</html>
