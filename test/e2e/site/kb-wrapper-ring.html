<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wrapper ring fixture</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 24px; }
  a { outline: none; }
  .wrap { display: inline-block; padding: 8px; margin: 8px; }
  .wrap:focus-within { outline: 3px solid #05c; }
  .own { outline: 2px solid #c50; }
  .own:focus { outline: none; }
  /* Le Monde's card: the ring is the wrapper's ::after, drawn while the link inside has :focus-visible. */
  .card { position: relative; display: inline-block; padding: 8px; margin: 8px; }
  .card::after { content: ''; position: absolute; inset: 0; pointer-events: none; }
  .card:has(a:focus-visible)::after { outline: 3px solid #05c; }
</style></head>
<body>
<div class="wrap"><a href="/w/1" id="ring-parent">Wrapped link</a></div>
<div class="wrap"><a href="/w/2" id="ring-swap" class="own">Swapped link</a></div>
<div class="card"><a href="/w/3" id="ring-after">Card link</a></div>
</body>
</html>
