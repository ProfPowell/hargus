<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pseudo ring fixture</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 24px; }
  a { outline: none; text-decoration: none; color: #222; }
  /* Le Monde's live card: the click area's ::after only exists (content) while the link three levels down has
     :focus-visible, and it draws the ring. Unfocused there is no pseudo-element at all. */
  .card { display: inline-block; margin: 8px; }
  .card__clickarea { position: relative; padding: 8px; }
  .card__clickarea:has(.card__link:focus-visible)::after { content: ''; position: absolute; inset: 0; outline: 2px solid #05c; pointer-events: none; }
  /* The same shape, but the pseudo-element that appears on focus draws nothing: still no visible focus change. */
  .card__clickarea--blank:has(.card__link:focus-visible)::after { outline: none; }
</style></head>
<body>
<div class="card"><div class="card__clickarea"><div class="card__title"><h2><a href="/p/1" id="ring-appear" class="card__link">Card with a ring</a></h2></div></div></div>
<div class="card"><div class="card__clickarea card__clickarea--blank"><div class="card__title"><h2><a href="/p/2" id="ring-appear-blank" class="card__link">Card without a ring</a></h2></div></div></div>
</body>
</html>
