<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Strict CSP</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>A page with a strict style CSP</h1>
    <p>This page is served with <code>style-src 'self'</code>, so an injected inline style element is blocked. The text-spacing view must still apply its spacing.</p>
    <p>A second paragraph, so the paragraph spacing has something to space.</p>
  </main>
</body>
</html>
