<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Consent message frame (does not hold focus)</title>
<style>
  html, body { background: transparent; margin: 0; }
  .dialog { position: absolute; left: 30%; top: 30%; width: 40%; padding: 16px; background: #fff; border: 1px solid #333; font: 16px/1.5 system-ui, sans-serif; }
</style></head>
<body>
<div class="dialog">
  <p>We and our partners use cookies. Choose what you allow.</p>
  <button type="button">Accept</button>
  <button type="button">Reject</button>
</div>
</body>
</html>
